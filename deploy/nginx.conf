# Run from the repo root as the normal user: nginx -p "$PWD" -c deploy/nginx.conf -g 'daemon off;'
# All relative paths below resolve against the -p prefix (the repo root). Only site/ is ever served.
worker_processes 1;
pid deploy/run/nginx.pid;
error_log deploy/run/error.log warn;

events { worker_connections 256; }

http {
    access_log deploy/run/access.log;
    client_body_temp_path deploy/run/client_body;
    proxy_temp_path deploy/run/proxy;
    fastcgi_temp_path deploy/run/fastcgi;
    uwsgi_temp_path deploy/run/uwsgi;
    scgi_temp_path deploy/run/scgi;

    types {
        text/html html;
        text/css css;
        application/javascript js;
        application/json json;
        image/svg+xml svg;
        image/x-icon ico;
        image/png png;
        font/woff2 woff2;
    }
    default_type application/octet-stream;
    server_tokens off;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    server {
        listen 127.0.0.1:8000;  # only cloudflared (local) connects
        root site;
        autoindex off;
        disable_symlinks on;
        client_max_body_size 1k;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

        location ~ /\. { deny all; }
        location ~ \.tmp$ { deny all; }

        location / {
            limit_except GET HEAD { deny all; }
            try_files $uri $uri/ =404;
        }
    }
}
