<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Istanbul Bus Times</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>Istanbul Bus Times</h1>
    <button id="gear" class="icon" aria-label="Settings" aria-expanded="false">⚙</button>
  </header>
  <div id="settings" hidden>
    <label class="switch"><input type="checkbox" id="includeOld"> Include data from before route changes</label>
  </div>

  <input id="search" type="search" placeholder="Line code or name, e.g. 500T" autocomplete="off">
  <ul id="results" hidden></ul>

  <section id="line" hidden>
    <h2 id="lineTitle"></h2>
    <div class="row" id="dirs"></div>
    <div class="row" id="days"></div>
    <label class="window">Data window
      <select id="windowSelect"></select>
    </label>

    <div id="slider"></div>

    <p class="note" id="note" hidden></p>
    <div class="tablewrap"><table id="table"></table></div>
  </section>
</main>
<script src="timetable.js"></script>
<script src="slider.js"></script>
<script src="app.js"></script>
</body>
</html>
